# Temporary diagnostic: which GitHub-hosted images pick up a job for this repo. Removed before merge.
name: probe
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: uname -a; sw_vers 2>/dev/null || true
